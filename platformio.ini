; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = platformio_override.ini

; Common configuration for all environments
[env]
platform = https://github.com/outlandnish/platform-ststm32.git
platform_packages =
  framework-arduinoststm32 @ https://github.com/outlandnish/Arduino_Core_STM32.git#101c8dbf9bbc4f60f4ec97f99d68072832e2a256
board = genericSTM32F413VH
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags =
		-D HAL_CAN_MODULE_ENABLED
		-Wl,-u,_printf_float
		-Wl,-u,_scanf_float
		-D UDS_SYS=5
		-I lib/iso14229
		-I include
		-Isrc
		-Wall
		-Wextra
		-Wno-unused-parameter
		-Werror=return-type
		-Werror=format
		-Wdouble-promotion
		-fstack-usage
		-Wl,-Map=${BUILD_DIR}/${PIOENV}.map
extra_scripts = pre:tools/gen_version.py
lib_deps =
	gustice/FreeRtosCppAPI@0.5.0
	stm32duino/STM32duino FreeRTOS@10.3.2
	khoih-prog/STM32_PWM@1.0.1
	collin80/can_common@0.4.0

; Bootloader environment — links at 0x08000000 (64KB), no RTOS, no app deps
[env:bootloader]
board_build.ldscript = bootloader.ld
build_flags =
	-D HAL_CAN_MODULE_ENABLED
	-I include
	-I src
	-Wall
	-Wextra
	-Wno-unused-parameter
	-Werror=return-type
	-fstack-usage
	-Wl,-Map=${BUILD_DIR}/${PIOENV}.map
lib_deps =
lib_extra_dirs =
	lib/bootloader
build_src_filter =
	+<main.bootloader.cpp>
extra_scripts = pre:tools/gen_version.py

; Main application environment — links at 0x08010000 (1472KB), started by bootloader
[env:hv-ecu]
board_build.ldscript = application.ld
build_flags =
	${env.build_flags}
	-D BRZ_HV_ECU
	-D DEBUG_WAIT_FOR_SERIAL
	-DAPP_ADDRESS=0x08010000
board_build.flash_offset = 0x10000
extra_scripts =
	pre:tools/gen_version.py
	post:tools/gen_flash_image.py
	post:tools/upload_flash_image.py
lib_deps =
	${env.lib_deps}
	adafruit/Adafruit NeoPixel@1.15.2
	bblanchon/ArduinoJson@7.2.1
test_framework = unity
build_src_filter =
	+<*>
	-<main.bootloader.cpp>
	-<main.hello.cpp>
	-<main_bms_can.cpp>
	-<battery_char.cpp>
	-<hal/hwinit_opencm3.cpp>
	-<hal/usb_cdc.c>
	-<main_opencm3.cpp>
	-<simple_charger.cpp>

; BMS CAN broadcaster — external protocol v0.1 (EXTERNAL_PLAN.md)
[env:bms-can]
board_build.ldscript = application.ld
board_build.flash_offset = 0x10000
build_flags =
	${env.build_flags}
	-D BRZ_HV_ECU
	-D DEBUG_WAIT_FOR_SERIAL
	-DAPP_ADDRESS=0x08010000
	-g3
	-Og
extra_scripts =
	pre:tools/gen_version.py
	post:tools/gen_flash_image.py
	post:tools/upload_flash_image.py
lib_deps =
	${env.lib_deps}
	adafruit/Adafruit NeoPixel@1.15.2
build_src_filter =
	+<*>
	-<main.cpp>
	-<main.bootloader.cpp>
	-<main.hello.cpp>
	-<battery_char.cpp>
	-<simple_charger.cpp>
	-<hal/hwinit_opencm3.cpp>
	-<hal/usb_cdc.c>
	-<main_opencm3.cpp>

; BMS unit test environment
[env:bms-test]
build_flags =
	${env.build_flags}
	-D BRZ_HV_ECU
lib_deps =
	${env.lib_deps}
test_framework = unity
build_src_filter =
	+<*>
	-<main.cpp>
	-<main.bootloader.cpp>
	-<battery_char.cpp>
	-<simple_charger.cpp>
